<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Developer Placeholder Image</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #3498db;
            font-family: Arial, sans-serif;
        }
        svg {
            width: 300px;
            height: 300px;
        }
        text {
            font-size: 24px;
            font-weight: bold;
            fill: white;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <rect width="300" height="300" fill="#2c3e50"/>
        <circle cx="150" cy="120" r="50" fill="#3498db"/>
        <rect x="110" y="180" width="80" height="80" fill="#3498db"/>
        <text x="150" y="260" text-anchor="middle">Developer</text>
    </svg>
</body>
</html>
